services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    environment:
      - DATABASE_URL=sqlite:////app/data/dashboard.db
      - LOG_LEVEL=info
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
